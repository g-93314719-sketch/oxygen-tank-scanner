<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Oxygen Tank Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f7fa;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
      word-break: break-all;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h1>📷 Oxygen Tank Scanner</h1>

  <div id="reader"></div>

  <div id="result">
    Waiting for barcode...
  </div>

  <script>

    const resultDiv =
      document.getElementById("result");

    const API_URL =
  "https://script.google.com/macros/s/AKfycbyaFR7ISlx_a7iGOLa7hGCbFAHBbiP-DgOKXIgsIM7BJC9joOJmYOThkim8my9uHEJc/exec";


let lastScanned = "";


function onScanSuccess(decodedText) {

  // 防止同一个 barcode 连续重复扫描
  if (decodedText === lastScanned) {
    return;
  }

  lastScanned = decodedText;

  resultDiv.innerHTML =
    "🔎 Searching TANK DB...<br><br>" +
    "<strong>" +
    decodedText +
    "</strong>";


  const callbackName =
    "tankCallback_" +
    Date.now();


  window[callbackName] = function(data) {

    console.log(
      "TANK DB response:",
      data
    );


    // 删除 callback
    delete window[callbackName];


    // 删除 script
    const script =
      document.getElementById(callbackName);

    if (script) {
      script.remove();
    }


    if (data.success) {

      resultDiv.innerHTML = `

        <div class="success">

          <h2>✅ TANK FOUND</h2>

          <p>
            <strong>Tank ID</strong><br>
            ${data.tankId}
          </p>

          <p>
            <strong>Barcode</strong><br>
            ${data.barcode}
          </p>

          <p>
            <strong>Type</strong><br>
            ${data.tankType}
          </p>

          <p>
            <strong>BN / PI</strong><br>
            ${data.bnPi}
          </p>

          <p>
            <strong>Current Location</strong><br>
            ${data.currentLocation}
          </p>

          <p>
            <strong>Status</strong><br>
            ${data.status}
          </p>

        </div>

      `;

    }

    else {

      resultDiv.innerHTML = `

        <div class="error">

          <h2>❌ TANK NOT FOUND</h2>

          <p>
            Barcode:
            <strong>
              ${decodedText}
            </strong>
          </p>

          <p>
            This barcode is not in TANK DB.
          </p>

        </div>

      `;

    }

  };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?action=findTank" +
    "&barcode=" +
    encodeURIComponent(decodedText) +
    "&callback=" +
    callbackName;


  document.body.appendChild(script);

}


    function onScanFailure(error) {

      // Ignore normal scanning failures
      // because the camera continuously scans.
    }


    const html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 150
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]

    };


    Html5Qrcode
      .getCameras()

      .then(devices => {

        if (devices && devices.length) {

          console.log(
            "Cameras found:",
            devices
          );


          // Try to find the rear camera
          let cameraId =
            devices[devices.length - 1].id;


          for (let device of devices) {

            const label =
              (device.label || "").toLowerCase();

            if (
              label.includes("back") ||
              label.includes("rear") ||
              label.includes("environment")
            ) {

              cameraId =
                device.id;

              break;
            }

          }


          html5QrCode
            .start(
              cameraId,
              config,
              onScanSuccess,
              onScanFailure
            )

            .then(() => {

              resultDiv.innerHTML =
                "🟢 Camera started<br>" +
                "Point the camera at a barcode.";

            })

            .catch(err => {

              console.error(err);

              resultDiv.innerHTML =
                "<span class='error'>" +
                "❌ Camera failed to start<br><br>" +
                err +
                "</span>";

            });

        }

        else {

          resultDiv.innerHTML =
            "<span class='error'>" +
            "❌ No camera found." +
            "</span>";

        }

      })

      .catch(err => {

        console.error(err);

        resultDiv.innerHTML =
          "<span class='error'>" +
          "❌ Unable to access camera<br><br>" +
          err +
          "</span>";

      });

  </script>

</body>
</html>
